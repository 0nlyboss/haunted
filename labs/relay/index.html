<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Relay</title><style>body{margin:0;background:#080808;color:#eee;font:14px system-ui}main{max-width:1100px;margin:auto;padding:64px 24px}h1{font:72px Georgia;margin:0}.muted{color:#888}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#292929;margin:45px 0}.stat,.service{background:#0d0d0d;padding:24px}.big{font:38px Georgia;margin-top:12px}.service{display:grid;grid-template-columns:1fr auto auto;gap:25px;border-bottom:1px solid #252525}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ddd;margin-right:10px}.k{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#777}@media(max-width:650px){.stats{grid-template-columns:1fr}.service{grid-template-columns:1fr auto}}</style></head><body><main><div class=k>HAUNTED / LAB 02</div><h1>Relay</h1><p class=muted>Realtime monitoring interface prototype. Demo telemetry is generated locally in-browser.</p><div class=stats><div class=stat><div class=k>Services online</div><div class=big id=online>4 / 4</div></div><div class=stat><div class=k>Mean latency</div><div class=big id=mean>42 ms</div></div><div class=stat><div class=k>Session uptime</div><div class=big id=up>00:00</div></div></div><div id=list></div></main><script>const names=['API Gateway','Auth Service','Database','Realtime Worker'],base=[31,48,22,55],start=Date.now();function draw(){let vals=base.map(x=>Math.max(8,Math.round(x+(Math.random()-.5)*18)));mean.textContent=Math.round(vals.reduce((a,b)=>a+b,0)/4)+' ms';list.innerHTML=names.map((n,i)=>`<div class=service><div><span class=dot></span>${n}</div><div class=muted>${vals[i]} ms</div><div class=k>operational</div></div>`).join('');let s=Math.floor((Date.now()-start)/1000);up.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}draw();setInterval(draw,1500)</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracekit</title><style>body{margin:0;background:#090909;color:#eee;font:14px system-ui}main{max-width:1000px;margin:auto;padding:64px 24px}h1{font:72px Georgia;margin:0 0 8px}.muted{color:#888}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#292929;margin-top:50px}.card{background:#0d0d0d;padding:25px;min-height:110px}.k{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#777}.v{margin-top:14px;word-break:break-word;line-height:1.6}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="k">HAUNTED / LAB 01</div><h1>Tracekit</h1><div class="muted">A local browser-environment inspector. Nothing is transmitted.</div><div class="grid" id="g"></div></main><script>const tests={"User agent":navigator.userAgent,"Platform":navigator.platform||'Unavailable',"Language":navigator.language,"Languages":navigator.languages?.join(', '),"CPU threads":navigator.hardwareConcurrency||'Unavailable',"Device memory":navigator.deviceMemory?navigator.deviceMemory+' GB':'Unavailable',"Screen":screen.width+' × '+screen.height+' @ '+devicePixelRatio+'x',"Timezone":Intl.DateTimeFormat().resolvedOptions().timeZone,"Cookies":navigator.cookieEnabled?'Enabled':'Disabled',"Local storage":(()=>{try{localStorage.setItem('_tk','1');localStorage.removeItem('_tk');return'Available'}catch{return'Blocked'}})(),"WebGL renderer":(()=>{try{let c=document.createElement('canvas'),g=c.getContext('webgl');let e=g.getExtension('WEBGL_debug_renderer_info');return e?g.getParameter(e.UNMASKED_RENDERER_WEBGL):'Available (renderer hidden)'}catch{return'Unavailable'}})(),"Canvas sample":(()=>{let c=document.createElement('canvas');let x=c.getContext('2d');x.font='16px serif';x.fillText('Tracekit',2,18);let s=c.toDataURL();let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return (h>>>0).toString(16).padStart(8,'0')})()};g.innerHTML=Object.entries(tests).map(([k,v])=>`<div class=card><div class=k>${k}</div><div class=v>${String(v)}</div></div>`).join('')</script></body></html>
